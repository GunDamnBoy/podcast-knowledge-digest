# 哨兵 —— 判斷邏輯在 kb-core 的 reusable workflow 裡，這裡只宣告「我是誰、何時跑」。
#
# 2026-08-20 由整份 YAML 收成 caller。原本每個資料 repo 各有一份九十行的複本，
# 那在只有一個 repo 時是對的（不為尚未存在的第二份先引入機制），
# 第二份出現時就不對了 —— **複本的成本要到第二個使用者才付得出來。**
#
# **排程 03:30 UTC（台北 11:30）。** GitHub 的排程會漂移、會漏跑，
# 而且 repo 連續 60 天沒有活動就會自動停用排程 —— 那正是 Mac 那一側
# `watch.sentinel_alive` 存在的理由：**這一支沒辦法自己證明自己活著。**

# **cron 與 `MAX_DATE_AGE_H` 是一組的，改一個就要回頭改另一個。**
# 年齡是從那一天的**台北零時**起算，上限 36 小時 —— 所以「昨天那一期」是在
# 次日中午 12:00 台北跨線。原本三個哨兵都排在 11:00–11:30，**距離那條線只有
# 30–60 分鐘**，而 GitHub 的排程延遲動輒數十分鐘（2026-08-20 那次延了五小時）。
# 一個判決取決於 cron 準不準時的檢查，會隨機紅、隨機綠。
#
# 改到 07:00 UTC（15:00 台北）之後：昨天的資料 39 小時 → **紅**，今天的 ≤15 小時 → 綠。
# 這同時改變了它問的問題：從「昨天那一期還在不在」（容忍漏掉一天）
# 變成「**今天這一期出來了沒**」。漏一天本來就該當天知道 ——
# 「降級若每天都成功，就不會有人把它升級成問題」的同一條。
name: sentinel

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  sentinel:
    uses: GunDamnBoy/kb-core/.github/workflows/sentinel-reusable.yml@main
    with:
      system_id: podcast-knowledge-digest
    permissions:
      contents: write
      issues: write
