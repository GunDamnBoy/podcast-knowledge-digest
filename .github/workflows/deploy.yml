name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # 不要中途取消正在進行的部署（GitHub 官方範本也是 false）——取消到一半的部署本身就是一種失敗形態。
  cancel-in-progress: false

jobs:
  # **2026-11-27 拆成 build／deploy 兩個 job，並在 deploy 失敗時原地重試一次。**
  # 11-18、11-25、11-26 三次失敗都是同一個形狀：`Upload artifact` 成功、
  # 那份 `github-pages` artifact 事後查得到（11-26 那份 6.95 MB、19:16:54 建立），
  # 但幾秒後的 `deploy-pages` 回「No artifacts named "github-pages" were found」——
  # 是 artifact API 的最終一致性延遲，不是內容問題。
  # （一）GitHub 官方 Pages 範本本來就是上傳與部署分兩個 job，換 runner 的那段時間就是緩衝；
  # （二）萬一仍查不到，在**同一個 run、同一個 job 裡**等 60 秒再部署一次。
  # 不能靠人在原 run 按 Re-run：那會再上傳一份同名 artifact，
  # 變成 `Multiple artifacts named "github-pages"`（11-26 實例），重跑幾次都一樣。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # **這裡的順序是被 `path: '.'` 逼出來的。**
      # 這個 workflow 上傳整個 repo（四套裡唯一沒有 `_site` 白名單的），
      # 所以在上傳之前 checkout 進來的任何東西都會跟著發到公開站上。
      # 而下面那道守衛必須在上傳之前跑 —— 上傳之後才發現內容錯了，
      # 錯的那份已經在讀者眼前了。
      #
      # 解法是**用完就刪**：取程式 → 驗 → 刪掉 → 才上傳。
      # 這比改成白名單小，但也**只是權宜** ——
      # 真正該做的是跟另外三套一樣挑檔案上傳（`README.md`、`AGENT_BRIEF.md`、
      # `MAINTENANCE.md`、`measure-ts-monotonic.py` 目前都在公開站上）。
      - name: 取驗證程式
        uses: actions/checkout@v5
        with:
          repository: GunDamnBoy/kb-core
          path: kb-core

      # **索引與日檔說的是不是同一件事。**
      # 清單頁讀 `data/index.json` 的複本、單篇頁讀 `data/<日期>.json`，
      # 兩邊漂開時**兩頁各自都正常、但說的不是同一件事**，沒有人會發現。
      # 2026-08-23 外資報告週摘就是這樣：首頁一整面舊標題、單篇頁全對，
      # 而 verify_live 是綠的而且它是對的（線上就是剛上傳的那份）。
      - name: 驗證索引與日檔一致
        run: python3 kb-core/tools/verify_site_index.py .

      # **刪掉再上傳。** 漏掉這一步，驗證程式自己會被發布到公開站上。
      - name: 移除驗證程式，不要發布它
        run: rm -rf kb-core

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 部署失敗時等 60 秒（artifact 查詢的最終一致性延遲）
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages（重試）
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # 這個 job 是新 runner，沒有 repo 也沒有 kb-core —— 兩個都要取。
      # verify_live 拿線上那份去比 repo 裡的 data/index.json。
      - name: Checkout
        uses: actions/checkout@v4

      - name: 取驗證程式（部署後）
        uses: actions/checkout@v5
        with:
          repository: GunDamnBoy/kb-core
          path: kb-core

      # **部署完不等於讀者看得到。** 哨兵讀的是 repo 的 checkout，
      # 證明的是「repo 裡的內容夠新」，不是「Pages 真的端出去了」。
      # 比雜湊不比欄位的理由寫在 verify_live.py 的 docstring ——
      # 2026-08-03 那次 days[0].date 早就是當天日期，只看日期會被騙。
      - name: 驗證線上那份就是剛上傳的那份
        run: |
          python3 kb-core/tools/verify_live.py \
            "${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}" data/index.json
